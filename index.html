<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voisho Lite</title>
<meta name="description" content="話すと、えー・あのを消した文章になる。iPhone だけで動く版。">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voisho">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Voisho スマホだけ版（2026-10-29）。Mac 版のスマホ画面と同じ色・形。Mac につながず、iPhone の Safari だけで動く */
:root { --bg:#f6f4ef; --paper:#fff; --ink:#1d1e22; --sub:#6d6a63; --line:#e4e0d7; --accent:#8a6a2a; --accent-ink:#fff; --rec:#c2412d; --soft:#ecebe5; --ok:#2e7d4f; --warn:#b7791f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16171b; --paper:#1f2026; --ink:#ecebe7; --sub:#9c9a94; --line:#2e2f36; --accent:#d8b25e; --accent-ink:#17181c; --rec:#ef6a55; --soft:#26272e; --ok:#6cc28f; --warn:#e0b35a; } }
:root[data-theme="dark"] { --bg:#16171b; --paper:#1f2026; --ink:#ecebe7; --sub:#9c9a94; --line:#2e2f36; --accent:#d8b25e; --accent-ink:#17181c; --rec:#ef6a55; --soft:#26272e; --ok:#6cc28f; --warn:#e0b35a; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); }
body { font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; -webkit-text-size-adjust:100%; }
button,input,textarea { font:inherit; color:inherit; }
#app { min-height:100dvh; display:flex; flex-direction:column; max-width:640px; margin:0 auto; padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px); }
.top { display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px; }
.brand { font-weight:700; letter-spacing:.02em; }
.brand small { font-weight:500; color:var(--sub); margin-left:6px; }
.tabs { display:flex; gap:6px; }
.tabs button { border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:4px 12px; font-size:13px; }
.tabs button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.tab { display:none; flex:1; flex-direction:column; gap:10px; }
.tab.on { display:flex; }
.notice { background:var(--soft); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--sub); }
.notice.warn { color:var(--warn); }
textarea#out { flex:1; min-height:38dvh; width:100%; resize:none; border:1px solid var(--line); background:var(--paper); border-radius:14px; padding:14px; font-size:17px; line-height:1.7; }
.raw { font-size:12px; color:var(--sub); min-height:1.6em; }
.acts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.act { border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:9px 0; font-size:14px; }
.micwrap { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 4px; }
.hint { font-size:13px; color:var(--sub); }
.mic { width:84px; height:84px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.12); }
.mic svg { width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
.mic.rec { background:var(--rec); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform:scale(1.06); } }
.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.list li { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.list .meta { font-size:12px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; margin-top:4px; }
.list button { border:0; background:none; color:var(--accent); padding:0; font-size:13px; }
.box { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; }
.box h2 { font-size:15px; margin:0 0 4px; }
.small { font-size:12px; color:var(--sub); margin:0 0 8px; }
.row { display:flex; gap:6px; align-items:center; }
.row input { flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:8px; }
.row button { border:0; background:var(--ink); color:var(--bg); border-radius:8px; padding:8px 12px; }
.toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 110px); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Voisho<small>スマホだけ版</small></div>
    <nav class="tabs">
      <button class="on" data-tab="talk" type="button">話す</button>
      <button data-tab="hist" type="button">履歴</button>
      <button data-tab="dict" type="button">言いかえ</button>
    </nav>
  </header>

  <section class="tab on" id="tab-talk">
    <div class="notice warn" id="nosupport" hidden>このブラウザでは声の聞き取りが使えません。iPhone の Safari（iOS 14.5 以降）で開いてください。</div>
    <textarea id="out" placeholder="下の丸いボタンを押して話してください。&#10;もう一度押すと、えー・あのを消した文章になって、自動でコピーされます。"></textarea>
    <div class="raw" id="raw"></div>
    <div class="acts">
      <button class="act" id="copyBtn" type="button">コピー</button>
      <button class="act" id="shareBtn" type="button">送る</button>
      <button class="act" id="redoBtn" type="button">整えなおす</button>
      <button class="act" id="clearBtn" type="button">消す</button>
    </div>
    <div class="micwrap">
      <div class="hint" id="hint">押して話す</div>
      <button class="mic" id="mic" type="button" aria-label="話す"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    </div>
  </section>

  <section class="tab" id="tab-hist">
    <p class="small">履歴はこの iPhone の中だけに残ります（声は残しません）。新しい順に50件まで。</p>
    <ul class="list" id="hist"></ul>
  </section>

  <section class="tab" id="tab-dict">
    <div class="box">
      <h2>言いかえ</h2>
      <p class="small">聞きまちがえやすい言葉を、正しい書き方に直します（例：あすとろじっく → AstLogic）。</p>
      <form class="row" id="wordForm"><input id="wFrom" placeholder="聞こえた言葉" autocomplete="off"><input id="wTo" placeholder="正しい書き方" autocomplete="off"><button type="submit">足す</button></form>
      <ul class="list" id="words" style="margin-top:8px"></ul>
    </div>
    <div class="notice">この版は、iPhone の聞き取りと「決まり」だけで整えます。Mac 版のような AI の仕上げ（句読点・言い直しの細かい直し・箇条書き）はしません。</div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="clean.js"></script>
<script>
// 声の聞き取りは iPhone の Safari に入っている仕組み（webkitSpeechRecognition）を使う。こちらのサーバーには何も送らない。
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let words = store.get("voisho.words", []);
let hist = store.get("voisho.hist", []);
let lastRaw = "";

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }
async function copy(text) {
  if (!text) return false;
  try { await navigator.clipboard.writeText(text); return true; }
  catch { const o = $("out"); o.select(); try { return document.execCommand("copy"); } catch { return false; } }
}

// タブ
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach((s) => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
});

// 聞き取り
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false, finalText = "";
if (!SR) { $("nosupport").hidden = false; $("mic").disabled = true; }

function start() {
  finalText = ""; $("raw").textContent = "";
  rec = new SR(); rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript + "、"; else interim += r[0].transcript;
    }
    $("raw").textContent = (finalText + interim).replace(/、$/, "");
  };
  // iPhone は少し黙ると聞き取りが止まるので、話している間は自動でつなぎなおす
  rec.onend = () => { if (recording) { try { rec.start(); } catch {} } };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { stop(true); toast("マイクと音声認識の許可が必要です（設定 → Safari）"); }
  };
  try { rec.start(); } catch { toast("聞き取りを始められませんでした"); return; }
  recording = true; $("mic").classList.add("rec"); $("hint").textContent = "話しています… もう一度押すと文章に";
}
async function stop(silent) {
  recording = false; $("mic").classList.remove("rec"); $("hint").textContent = "押して話す";
  try { rec && rec.stop(); } catch {}
  if (silent) return;
  await new Promise((r) => setTimeout(r, 400));   // 最後の言葉が届くのを少し待つ
  lastRaw = ($("raw").textContent || "").trim();
  if (!lastRaw) { toast("聞き取れませんでした"); return; }
  const text = VoishoClean.clean(lastRaw, words);
  $("out").value = text;
  hist.unshift({ at: Date.now(), text }); hist = hist.slice(0, 50); store.set("voisho.hist", hist); drawHist();
  toast((await copy(text)) ? "コピーしました" : "文章にしました（コピーはボタンで）");
}
$("mic").onclick = () => (recording ? stop() : start());

// ボタン
$("copyBtn").onclick = async () => toast((await copy($("out").value)) ? "コピーしました" : "コピーできませんでした");
$("shareBtn").onclick = async () => { const t = $("out").value; if (!t) return; if (navigator.share) { try { await navigator.share({ text: t }); } catch {} } else toast((await copy(t)) ? "コピーしました" : ""); };
$("redoBtn").onclick = () => { if (lastRaw) { $("out").value = VoishoClean.clean(lastRaw, words); toast("整えなおしました"); } };
$("clearBtn").onclick = () => { $("out").value = ""; $("raw").textContent = ""; lastRaw = ""; };

// 履歴
function drawHist() {
  const ul = $("hist"); ul.innerHTML = "";
  if (!hist.length) { ul.innerHTML = '<li class="small">まだありません</li>'; return; }
  hist.forEach((h) => {
    const li = document.createElement("li"); const p = document.createElement("div"); p.textContent = h.text;
    const m = document.createElement("div"); m.className = "meta";
    const d = new Date(h.at); const s = document.createElement("span"); s.textContent = `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "コピー"; b.onclick = async () => toast((await copy(h.text)) ? "コピーしました" : "");
    m.append(s, b); li.append(p, m); ul.append(li);
  });
}
// 言いかえ
function drawWords() {
  const ul = $("words"); ul.innerHTML = "";
  words.forEach((w, i) => {
    const li = document.createElement("li"); li.className = "row"; const s = document.createElement("span"); s.style.flex = "1"; s.textContent = `${w.from} → ${w.to}`;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "外す"; b.style.background = "none"; b.style.color = "var(--accent)";
    b.onclick = () => { words.splice(i, 1); store.set("voisho.words", words); drawWords(); };
    li.append(s, b); ul.append(li);
  });
}
$("wordForm").onsubmit = (e) => { e.preventDefault(); const f = $("wFrom").value.trim(), t = $("wTo").value.trim(); if (!f) return; words.push({ from: f, to: t }); store.set("voisho.words", words); $("wFrom").value = $("wTo").value = ""; drawWords(); };
drawHist(); drawWords();
</script>
</body>
</html>
